<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud Server Management Console</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --border-color: #30363d;
      --text-main: #c9d1d9;
      --text-muted: #8b949e;
      --accent-blue: #58a6ff;
      --success-green: #238636;
      --danger-red: #da3633;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; }
    
    /* Header */
    .header { background-color: var(--card-bg); border-bottom: 1px solid var(--border-color); padding: 20px 30px; }
    .header h1 { font-size: 22px; font-weight: 600; color: #ffffff; letter-spacing: 0.5px; }
    .header p { font-size: 13px; color: var(--text-muted); margin-top: 5px; }
    
    .container { display: flex; flex: 1; overflow: hidden; padding: 20px; gap: 20px; max-width: 1400px; margin: 0 auto; width: 100%; }
    
    /* Bot List Table */
    .bot-section { flex: 1; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 6px; display: flex; flex-direction: column; overflow: hidden; }
    .section-title { padding: 15px 20px; border-bottom: 1px solid var(--border-color); font-size: 14px; font-weight: 600; text-transform: uppercase; color: var(--text-muted); background: #0d1117; }
    
    .table-container { overflow-y: auto; flex: 1; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 12px 20px; border-bottom: 1px solid var(--border-color); font-size: 14px; }
    th { color: var(--text-muted); font-weight: 500; position: sticky; top: 0; background: var(--card-bg); z-index: 10; }
    td.bot-name { font-weight: 600; color: var(--accent-blue); }
    
    .status-badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; border: 1px solid transparent; }
    .status-online { background: rgba(35, 134, 54, 0.1); color: #3fb950; border-color: rgba(63, 185, 80, 0.4); }
    .status-offline { background: rgba(218, 54, 51, 0.1); color: #ff7b72; border-color: rgba(255, 123, 114, 0.4); }
    
    .action-btn { padding: 6px 12px; border: none; border-radius: 4px; font-size: 12px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn-start { background-color: var(--success-green); color: #ffffff; }
    .btn-start:hover:not(:disabled) { background-color: #2ea043; }
    .btn-stop { background-color: transparent; border: 1px solid var(--danger-red); color: #ff7b72; }
    .btn-stop:hover:not(:disabled) { background-color: var(--danger-red); color: #ffffff; }
    .action-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Terminal Console */
    .terminal-section { flex: 1; background: #010409; border: 1px solid var(--border-color); border-radius: 6px; display: flex; flex-direction: column; }
    .terminal-output { flex: 1; padding: 15px; overflow-y: auto; font-family: "Courier New", Courier, monospace; font-size: 13px; line-height: 1.6; color: #3fb950; white-space: pre-wrap; word-wrap: break-word; }
    .log-system { color: var(--accent-blue); }
  </style>
</head>
<body>

  <div class="header">
    <h1>Cloud Server Management Console</h1>
    <p>Repository Synchronization Active | Multiple Process Support Enabled</p>
  </div>

  <div class="container">
    <!-- Active Bots Table -->
    <div class="bot-section">
      <div class="section-title">Deployed Bot Scripts</div>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Script Name</th>
              <th>Process ID</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="botTableBody">
            <tr><td colspan="4" style="text-align: center; color: var(--text-muted);">Scanning repository for scripts...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Live Terminal -->
    <div class="terminal-section">
      <div class="section-title" style="display: flex; justify-content: space-between;">
        <span>System Terminal Logs</span>
        <span style="cursor: pointer; color: var(--accent-blue);" onclick="clearLogs()">Clear Console</span>
      </div>
      <div class="terminal-output" id="terminal">Initializing connection to host server...
</div>
    </div>
  </div>

  <script>
    const terminal = document.getElementById('terminal');
    const tableBody = document.getElementById('botTableBody');

    // Fetch and display all .py files
    async function loadBots() {
      try {
        const res = await fetch('/api/bots');
        const data = await res.json();
        
        tableBody.innerHTML = '';
        if(data.bots.length === 0) {
          tableBody.innerHTML = '<tr><td colspan="4" style="text-align: center;">No Python scripts found in repository.</td></tr>';
          return;
        }

        data.bots.forEach(bot => {
          const tr = document.createElement('tr');
          
          // Status classes
          const statusClass = bot.running ? 'status-online' : 'status-offline';
          const statusText = bot.running ? 'ONLINE' : 'OFFLINE';
          
          tr.innerHTML = `
            <td class="bot-name">${bot.name}</td>
            <td>${bot.pid}</td>
            <td><span class="status-badge ${statusClass}">${statusText}</span></td>
            <td style="display: flex; gap: 8px;">
              <button class="action-btn btn-start" onclick="toggleBot('start', '${bot.name}')" ${bot.running ? 'disabled' : ''}>Start</button>
              <button class="action-btn btn-stop" onclick="toggleBot('stop', '${bot.name}')" ${!bot.running ? 'disabled' : ''}>Stop</button>
            </td>
          `;
          tableBody.appendChild(tr);
        });
      } catch(e) {
        console.error("Error loading bots");
      }
    }

    async function toggleBot(action, botName) {
      try {
        await fetch(`/api/${action}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ bot_name: botName })
        });
        setTimeout(loadBots, 1000);
      } catch(e) {
        alert("Operation failed: " + e.message);
      }
    }

    function clearLogs() {
      terminal.innerHTML = '';
    }

    function connectSocket() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const socket = new WebSocket(`${protocol}//${location.host}/ws/logs`);
      
      socket.onopen = () => { terminal.innerHTML += "<span class='log-system'>[SYSTEM] WebSocket Connection Established.</span>\n"; };
      socket.onmessage = (e) => {
        let msg = e.data;
        if(msg.includes("[SYSTEM]")) {
          msg = `<span class="log-system">${msg}</span>`;
        }
        terminal.innerHTML += msg;
        terminal.scrollTop = terminal.scrollHeight;
      };
      socket.onclose = () => { setTimeout(connectSocket, 2000); };
    }

    // Initial logic
    loadBots();
    connectSocket();
    setInterval(loadBots, 5000); // Auto-refresh table every 5 seconds
  </script>
</body>
</html>

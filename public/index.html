<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Bot Console</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --primary: #3b82f6;
      --success: #10b981;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; height: 100vh; padding: 20px; }
    
    .card { background: var(--card); padding: 35px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%; max-width: 450px; text-align: center; border: 1px solid #334155; }
    .card h1 { font-size: 26px; margin-bottom: 8px; color: var(--text); }
    .card p { color: #94a3b8; font-size: 14px; margin-bottom: 30px; }

    .status-container { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 35px; background: #0f172a; padding: 18px; border-radius: 12px; border: 1px solid #1e293b; }
    .status-dot { width: 14px; height: 14px; border-radius: 50%; background: #64748b; transition: 0.3s; }
    .status-dot.online { background: var(--success); box-shadow: 0 0 12px var(--success); }
    .status-text { font-weight: 700; font-size: 18px; letter-spacing: 1px; transition: 0.3s; }

    .btn-group { display: flex; gap: 15px; }
    button { flex: 1; padding: 16px; font-size: 16px; font-weight: bold; border-radius: 12px; border: none; cursor: pointer; transition: all 0.3s ease; color: white; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .btn-start { background: var(--success); }
    .btn-start:hover:not(:disabled) { background: #059669; transform: translateY(-2px); box-shadow: 0 6px 12px rgba(16, 185, 129, 0.3); }
    .btn-stop { background: var(--danger); }
    .btn-stop:hover:not(:disabled) { background: #dc2626; transform: translateY(-2px); box-shadow: 0 6px 12px rgba(239, 68, 68, 0.3); }
    button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

    .log { margin-top: 25px; font-size: 13px; color: #cbd5e1; background: #0f172a; padding: 15px; border-radius: 10px; font-family: monospace; word-wrap: break-word; min-height: 45px; border: 1px dashed #334155; }
  </style>
</head>
<body>

  <div class="card">
    <h1>🤖 Bot Console</h1>
    <p>Webhook Management Dashboard</p>

    <div class="status-container">
      <div id="statusDot" class="status-dot"></div>
      <div id="statusText" class="status-text" style="color: #64748b;">CHECKING...</div>
    </div>

    <div class="btn-group">
      <button id="btnStart" class="btn-start" onclick="toggleServer('start')" disabled>▶ Start</button>
      <button id="btnStop" class="btn-stop" onclick="toggleServer('stop')" disabled>⏹ Stop</button>
    </div>

    <div id="logMsg" class="log">Connecting to server...</div>
  </div>

  <script>
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const btnStart = document.getElementById('btnStart');
    const btnStop = document.getElementById('btnStop');
    const logMsg = document.getElementById('logMsg');

    async function checkStatus() {
      try {
        const res = await fetch('/api/bot_control');
        const data = await res.json();

        if (data.is_running) {
          statusDot.className = 'status-dot online';
          statusText.innerText = 'ONLINE';
          statusText.style.color = '#10b981';
          btnStart.disabled = true;
          btnStop.disabled = false;
          logMsg.innerText = `✅ Webhook is Active\nURL: ${data.webhook_url}`;
        } else {
          statusDot.className = 'status-dot';
          statusText.innerText = 'OFFLINE';
          statusText.style.color = '#64748b';
          btnStart.disabled = false;
          btnStop.disabled = true;
          logMsg.innerText = "🔴 Bot is currently stopped.";
        }
      } catch (e) {
        logMsg.innerText = "Error loading status: " + e.message;
      }
    }

    async function toggleServer(action) {
      btnStart.disabled = true;
      btnStop.disabled = true;
      logMsg.innerText = `Sending ${action} command...`;

      try {
        const res = await fetch('/api/bot_control', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: action, domain: window.location.origin })
        });
        const data = await res.json();
        
        if (data.ok || data.status === "ok") {
            logMsg.innerText = `Success: Bot ${action}ed!`;
        } else {
            logMsg.innerText = `Response: ` + JSON.stringify(data);
        }
        setTimeout(checkStatus, 1500);
      } catch(e) {
        logMsg.innerText = "Action failed: " + e.message;
        setTimeout(checkStatus, 1500);
      }
    }

    // Auto-check status when page loads
    checkStatus();
  </script>
</body>
</html>
